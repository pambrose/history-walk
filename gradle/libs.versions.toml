[versions]
# Kotlin and JVM
kotlin = "2.4.21"
jvm = "25"

config = "6.1.2"
kiluaRpc = "0.0.46"
kotlinter = "5.7.0"
kover = "0.9.11"
# Required by kilua
ksp = "2.3.13"
kvision = "9.7.0"
versions = "0.67.0"
exposed = "1.6.0"
flexmark = "0.64.8"
flyway = "13.12.0"
hikari = "7.1.0"
ktor = "3.6.1"
logback = "1.6.6"
kotest = "6.2.6"
mockk = "1.14.11"
testcontainers = "2.0.5"
logging = "8.0.4"
pgsql = "42.7.14"
pgjdbc = "0.8.9"
utils = "5.2.0"

[plugins]
config = { id = "com.github.gmazzo.buildconfig", version.ref = "config" }
#detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
#diktat = { id = "com.saveourtool.diktat", version.ref = "diktat" }
kiluaRpc = { id = "dev.kilua.rpc", version.ref = "kiluaRpc" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotest = { id = "io.kotest", version.ref = "kotest" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kvision = { id = "io.kvision", version.ref = "kvision" }
versions = { id = "io.github.ben-manes.versions", version.ref = "versions" }


[libraries]
# Kotlin standard libraries
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }

# Ktor server
ktor-bom = { group = "io.ktor", name = "ktor-bom", version.ref = "ktor" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core-jvm" }
ktor-server-auth = { group = "io.ktor", name = "ktor-server-auth-jvm" }
ktor-server-call-logging = { group = "io.ktor", name = "ktor-server-call-logging-jvm" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio-jvm" }
ktor-server-auto-head-response = { group = "io.ktor", name = "ktor-server-auto-head-response-jvm" }
ktor-server-compression = { group = "io.ktor", name = "ktor-server-compression-jvm" }
ktor-server-conditional-headers = { group = "io.ktor", name = "ktor-server-conditional-headers-jvm" }
ktor-server-config-yaml = { group = "io.ktor", name = "ktor-server-config-yaml-jvm" }
ktor-server-default-headers = { group = "io.ktor", name = "ktor-server-default-headers-jvm" }
ktor-server-html-builder = { group = "io.ktor", name = "ktor-server-html-builder-jvm" }
ktor-server-metrics = { group = "io.ktor", name = "ktor-server-metrics-jvm" }
ktor-server-metrics-micrometer = { group = "io.ktor", name = "ktor-server-metrics-micrometer-jvm" }
ktor-server-sessions = { group = "io.ktor", name = "ktor-server-sessions-jvm" }
ktor-server-status-pages = { group = "io.ktor", name = "ktor-server-status-pages-jvm" }
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host-jvm" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json-jvm" }

# Ktor client
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio-jvm" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation-jvm" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock-jvm", version.ref = "ktor" }

# KVision framework
kvision-core = { group = "io.kvision", name = "kvision", version.ref = "kvision" }
kvision-state = { group = "io.kvision", name = "kvision-state", version.ref = "kvision" }
kvision-bootstrap = { group = "io.kvision", name = "kvision-bootstrap", version.ref = "kvision" }
kvision-common-remote = { group = "io.kvision", name = "kvision-common-remote", version.ref = "kvision" }
kvision-fontawesome = { group = "io.kvision", name = "kvision-fontawesome", version.ref = "kvision" }
kvision-rest = { group = "io.kvision", name = "kvision-rest", version.ref = "kvision" }
kvision-testutils = { group = "io.kvision", name = "kvision-testutils", version.ref = "kvision" }

# Kilua RPC
kilua-rpc-ktor = { group = "dev.kilua", name = "kilua-rpc-ktor", version.ref = "kiluaRpc" }

# Common utils
utils-bom = { module = "com.pambrose.common-utils:common-utils-bom", version.ref = "utils" }
common-utils-core = { group = "com.pambrose.common-utils", name = "core-utils" }
common-utils-ktor = { group = "com.pambrose.common-utils", name = "ktor-server-utils" }
common-utils-exposed ={ group = "com.pambrose.common-utils", name = "exposed-utils" }

#history-walk-content = { group = "com.github.pambrose", name = "history-walk-content", version.ref = "slide-content" }
#history-walk-slides = { group = "com.github.pambrose", name = "history-walk-slides", version.ref = "slides" }

postgresql = { group = "org.postgresql", name = "postgresql", version.ref = "pgsql" }
pgjdbc-ng = { group = "com.impossibl.pgjdbc-ng", name = "pgjdbc-ng-all", version.ref = "pgjdbc" }
hikariCP = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikari" }

# Database
exposed-bom = { group = "org.jetbrains.exposed", name = "exposed-bom", version.ref = "exposed" }
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc" }

exposed-kotlin-datetime = { group = "org.jetbrains.exposed", name = "exposed-kotlin-datetime" }

flyway-core = { group = "org.flywaydb", name = "flyway-core", version.ref = "flyway" }
flyway-database-postgresql = { group = "org.flywaydb", name = "flyway-database-postgresql", version.ref = "flyway" }

flexmark = { group = "com.vladsch.flexmark", name = "flexmark", version.ref = "flexmark" }

kotlin-logging = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "logging" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }

# Testing
kotest-runner = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-assertions = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-framework-engine = { group = "io.kotest", name = "kotest-framework-engine", version.ref = "kotest" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
testcontainers-postgresql = { group = "org.testcontainers", name = "testcontainers-postgresql", version.ref = "testcontainers" }
