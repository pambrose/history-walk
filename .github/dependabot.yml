# Weekly version-update pull requests. Security updates also need Dependabot alerts turned on in the repository's
# settings.
#
# Every ecosystem waits 7 days after a release before proposing it (`cooldown`), so a release that is pulled, or found
# to be compromised, in its first week never arrives as a pull request. Security updates are not held back. zizmor's
# dependabot-cooldown audit (`make zizmor`) fails an ecosystem that waits less.
version: 2
updates:
  # Pin each action to a commit SHA with a "# vX.Y.Z" comment; Dependabot moves both together, so a tag that is later
  # moved cannot change what CI runs. All action updates arrive together in one grouped pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: [ "*" ]

  # gradle/libs.versions.toml and the Gradle wrapper. Version updates are off: a limit of 0 open pull requests stops
  # them, and they are checked by hand with `make versions`. The limit does not apply to security updates, so an alert
  # on a JVM library (reported by .github/workflows/dependency-graph.yml) that Dependabot can fix in the catalog still
  # arrives as a pull request.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0

  # The Dockerfile's base image, pinned to a digest so each move of its tag arrives as a PR. Major updates are ignored:
  # the Java major version moves by hand, with `jvm` in gradle/libs.versions.toml and system.properties (Heroku).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [ "version-update:semver-major" ]
