name: Website

# Publishes the documentation site (website/history-walk, built with Zensical) to GitHub Pages. A pull request that
# changes it gets the build as a check, and nothing is published until it reaches master. The site's llms.txt is a
# symlink to the top-level llms.txt, so a change to that file publishes the site too. GitHub Pages must be set to
# deploy from GitHub Actions (Settings > Pages > Build and deployment > Source).
on:
  push:
    branches: [ master ]
    paths:
      - "website/**"
      - "llms.txt"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [ master ]
    paths:
      - "website/**"
      - "llms.txt"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions: { }

concurrency:
  # A new push to a pull request supersedes the check for the old one. Deploys share one group and are never cancelled,
  # as GitHub advises for Pages, so a deploy in progress always finishes and the next one waits for it.
  group: website-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: the build is quick, and a workflow that publishes should not restore what another run saved
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # Installs Zensical at the version website/uv.lock pins, then builds, failing on any warning (a broken link, say)
      - name: Build the site
        run: make website-build

      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/history-walk/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
