name: Dependency Graph

# Dependabot reads the Actions workflows itself, but not Gradle's build: without a submitted graph it never sees a JVM
# library, so no alert or security update fires for anything the server ships. This submits the libraries in the
# server's jar (jvmRuntimeClasspath) on each push to master. Test and build tooling is left out: it never runs in
# production, and its alerts would bury the ones that matter.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit the server's runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the dependency submission API writes the graph
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph: generate-and-submit
          dependency-graph-include-configurations: '^jvmRuntimeClasspath$'
