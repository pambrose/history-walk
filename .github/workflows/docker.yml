name: Docker Image

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes the run for the old one; each master commit gets a group of its own.
  group: docker-image-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Builds what a deploy ships, the fat jar with the webpacked client and then the image, without pushing it, and starts
  # the image against Postgres with make docker-smoke, as make ci does: Flyway migrates the empty database on startup,
  # so a server that answers has applied the migrations and connected through the app's own pgjdbc-ng driver.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the fat jar and the Docker image
        run: make docker-build DOCKER_IMAGE=history-walk-ci

      # Heroku starts the jar the Procfile names, so a build that writes another file name (as a versioned name did
      # after each version bump) leaves the dyno unable to start. The checkout is clean, so only the jar just built
      # can satisfy it.
      - name: Check that the Procfile runs the jar the build wrote
        run: make procfile-check

      - name: Start the image against Postgres and check that it answers
        run: make docker-smoke DOCKER_IMAGE=history-walk-ci
