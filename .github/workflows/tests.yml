name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes the run for the old one; each master commit gets a group of its own, so no
  # master commit is left untested.
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # The JVM specs, with coverage, and the client specs. The database specs start postgres:18 through Testcontainers,
  # using the Docker the ubuntu runner already has; the client specs (jsTest) run under Karma in the runner's Chrome,
  # headless. Both are in this job, whose name is the required status check, so a failing client spec blocks a merge.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # --continue runs the rest when a spec fails, so both suites report and the coverage reports are still produced;
      # koverLog prints the JVM total in the job log (Kover measures the JVM code only)
      - name: Run tests with coverage
        run: ./gradlew jvmTest jsTest koverXmlReport koverHtmlReport koverLog --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: build/reports/kover/
          retention-days: 14
