name: Security

# Scans the image a deploy ships for known vulnerabilities: Trivy reads the Alpine and JRE layers and every library in
# the fat jar, and fails on a HIGH or CRITICAL vulnerability that has a fix. It also reports, without failing, on the
# client's npm lock (lock-scan), whose packages the image scan cannot see. The base image is pinned by digest, so a
# newly published CVE changes nothing in the repository: only the weekly run would notice it. Findings from master and
# the weekly run go to the repository's code scanning alerts. No untrusted event payloads are referenced.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes the run for the old one; other runs are never cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the fat jar and the Docker image
        id: image
        run: make docker-build DOCKER_IMAGE=history-walk-ci

      # trivy-action caches its vulnerability database under a new dated key each day it scans; cleanup-runs.yml deletes
      # the old ones.
      - name: Fail on a fixable HIGH or CRITICAL vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: history-walk-ci:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Pull requests only print the table above: uploading needs a token that fork and Dependabot pull requests lack.
      # The upload keeps HIGH and CRITICAL findings that have no fix yet, so they stay visible. trivy-action drops the
      # severity filter for SARIF output unless limit-severities-for-sarif is set.
      - name: Write the findings as SARIF
        if: always() && steps.image.outcome == 'success' && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: history-walk-ci:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload the findings to code scanning
        if: always() && steps.image.outcome == 'success' && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # The client's npm packages are webpacked into the jar's main.bundle.js, where the image scan cannot see them, so their
  # lock (.kotlin-js-store/yarn.lock) is scanned on its own. It reports and does not fail: the lock's fixable HIGH and
  # CRITICAL findings, all in the build and test tools (karma, webpack's helpers), are issue 28 of
  # docs/code-review-2026-11-11.md. Once they are fixed, give the first step exit-code '1' to make this a gate.
  lock-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report fixable HIGH or CRITICAL vulnerabilities in the npm lock
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .kotlin-js-store
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Write the findings as SARIF
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .kotlin-js-store
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-npm-lock.sarif

      - name: Upload the findings to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-npm-lock.sarif
          category: trivy-npm-lock
