name: zizmor

# Audits what runs CI, the workflows and dependabot.yml, for the ways a workflow can be turned against the repository: a
# token left behind by a checkout, an expression spliced into a shell command, a pinned SHA that is not a commit of the
# action it names, a known-vulnerable action, permissions wider than a job needs. It runs on pull requests that change
# .github too, so a workflow edit or one of Dependabot's action bumps is audited before it merges. `make zizmor` runs
# the same audits locally.
on:
  push:
    branches: [ master ]
    paths: [ ".github/**" ]
  pull_request:
    branches: [ master ]
    paths: [ ".github/**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes the run for the old one; each master commit gets a group of its own.
  group: zizmor-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The findings fail the job and appear as annotations on the pull request, rather than going to the Security tab.
      # The online audits use the job's token. The action pins zizmor's image by digest, so its own SHA fixes which
      # zizmor runs, and Dependabot moves the two together.
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
