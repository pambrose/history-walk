# Project coordinates: Gradle sets project.group and project.version from these, and the Makefile reads version
group=com.pambrose
version=1.0.0
# The RPC API version. Increment it only when the RPC interfaces (IContentService and what it carries) change: an
# open page whose bundle has another apiVersion is asked to reload, then reloads itself (ClientVersionCheck)
apiVersion=1.0.0

# Gradle settings
org.gradle.jvmargs=-Xmx4g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.js.ir.output.granularity=per-file
kotlin.mpp.applyDefaultHierarchyTemplate=false
